spring:
  application:
    name: stocks

  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5435/fiipractic?currentSchema=stocks
    username: stocksuser
    password: stockspassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
      format_sql: true
      use_sql_comments: true
      jdbc:
        batch_size: 20
        fetch_size: 50
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/stock

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin

alphavantage:
  api-key: changeThis
  base-url: https://www.alphavantage.co/query

logbull:
  enabld: true
  host: http://localhost:4005
  project-id: changeThis
  api-key: changeThis
  log-level: INFO

